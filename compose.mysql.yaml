# Local development / test MySQL
name: faction-mysql
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_USER: faction
      MYSQL_PASSWORD: faction
      MYSQL_DATABASE: faction
      MYSQL_ROOT_PASSWORD: faction-root
    ports: ["33061:3306"]
    volumes: [mysqldata:/var/lib/mysql]
volumes:
  mysqldata:
